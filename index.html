<title>Entry Test - Grado 3</title>

      --topbar-ink:#ffd9ea;
      --accent:#ff8fc0;
      --accent-dark:#ffb3d6;
      --progress-bg:#3a2430;
      --progress-track:#5a3548;
      --progress-fill:#ff8fc0;

    border-radius:6px;

  }

  .vocab-card img{

    border:1px solid var(--line);

    font-size:0.95rem;

  .vocab-blank{

    min-width:64px;

  .vocab-blank.correct{
    border-color:var(--good);

    background:var(--good-bg);

  .vocab-blank.wrong{
    border-color:var(--bad);
    color:var(--bad);
    background:var(--bad-bg);

  .vocab-blank.example{
    border-style:solid;
    font-style:italic;
    cursor:default;

  .vocab-word.used{
    opacity:0.35;
    cursor:not-allowed;
  }
  .vocab-paragraph{
    line-height:1.8;
    font-size:1.02rem;
    margin:0 0 16px;

  /* ---------- READING ACTIVITY ---------- */
  .reading-passage{
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
    margin-bottom:22px;

  .reading-passage.letter{

  .reading-passage .signoff{

  .reading-passage.message{

  }
  .reading-passage.message .msg-header{
    background:var(--accent);
    color:#fff;
    padding:8px 14px;
    font-size:0.85rem;
  }
  .reading-passage.message .msg-body{
    padding:16px;
  }
  .reading-question{
    font-weight:700;
    margin-bottom:14px;
    font-size:1.02rem;
  }
  .reading-options-img{
    display:flex;
    flex-wrap:wrap;
    gap:18px;
  }
  .reading-opt-img{
    display:flex;
    align-items:center;
    gap:8px;

  .reading-options-text{

  .reading-opt-text{

  .reading-photo{

    width:100%;
    border-radius:12px;
    display:block;
    margin:0 auto 22px;
  }
  .reading-centered{
    text-align:center;
  }
  .reading-centered .reading-options-text{
    align-items:center;

  .reading-centered .reading-options-img{

  .reading-centered .reading-opt-img img{

  /* ---------- LISTENING (shared) ---------- */
  .listen-btn{
    width:52px;
    height:52px;
    border-radius:50%;
    border:2px solid var(--accent);

  .lm-scroll{

  .lm-wrap{
    position:relative;

  .gmc-block{

const activities = [

const results = {}; // id -> {correct, total, score, rawPoints}
let totalScore = 0;

function applyScore(activityId, correctCount, total){
  const prev = results[activityId];
  if(prev){
    totalScore -= prev.rawPoints; // un intento anterior ya habia sumado puntos: los quitamos primero
  }
  const bonus = (correctCount === total) ? 5 : 0;
  const rawPoints = correctCount + bonus;
  totalScore += rawPoints;
  results[activityId] = {correct:correctCount, total:total, score:Math.round(correctCount/total*100), rawPoints:rawPoints};
}
let screen = "menu"; // "menu" or an activity id

const app = document.getElementById("app");
const lockToast = document.getElementById("lockToast");
const LOCK_TOAST_DEFAULT = lockToast.textContent;

function showLockToast(msg){
  lockToast.textContent = msg;
  lockToast.classList.add("show");
  setTimeout(() => {
    lockToast.classList.remove("show");
    lockToast.textContent = LOCK_TOAST_DEFAULT;
  }, 1800);
}

// Devuelve una lineita pequena en espanol debajo de un texto en ingles (para que la mama de Daleska
// entienda de que trata la actividad/pregunta). Si no hay traduccion, no muestra nada.
function esLine(text){
  return text ? '<span class="es">&#127466;&#127480; '+text+'</span>' : '';
}

/* ================= MENU ================= */

function renderMenu(){
  const doneCount = Object.keys(results).length;
  let html = "";
  html += '<div class="menu-header"><h1>ENTRY TEST</h1><div class="sub">Completa todas las actividades.</div></div>';
  html += '<div class="menu-progress"><div class="track"><div class="fill" style="width:'+(doneCount/activities.length*100)+'%"></div></div><div class="count">'+doneCount+'/'+activities.length+'</div></div>';
  html += '<div class="menu-list">';
  activities.forEach(a => {
    const res = results[a.id];
    const locked = !a.ready;
    let statusHtml = '<span class="status">-</span>';
    if(res){
      statusHtml = '<span class="status done">'+res.correct+'/'+res.total+'</span>';
    } else if(locked){
      statusHtml = '<span class="status">&#128274;</span>';
    }
    html += '<div class="menu-item '+(locked?'locked':'')+'" data-id="'+a.id+'">';
    html += '<div class="icon">&#128187;</div>';
    html += '<div class="info"><div class="title">'+a.title+'</div><div class="cat">'+a.category+'</div></div>';
    html += statusHtml;
    html += '</div>';
  });
  html += '</div>';
  app.innerHTML = html;

  document.querySelectorAll(".menu-item").forEach(el => {
    el.onclick = () => {
      const id = el.getAttribute("data-id");
      const a = activities.find(x => x.id === id);
      if(!a.ready){
        lockToast.classList.add("show");
        setTimeout(() => lockToast.classList.remove("show"), 1600);
        return;
      }
      screen = id;
      renderScreen();
    };
  });
}

/* ================= GRAMMAR ACTIVITY ================= */

  const d = activity.data;
  const state = {
    answers: new Array(d.questions.length).fill(""),
    submitted:false,
    correctFlags:[]

/* ================= VOCABULARY ACTIVITY ================= */

function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function renderVocabulary(activity){
  const d = activity.data;
  const bank = shuffleArr(d.bankWords.map((w,i)=>({word:w, id:i})));
  const placed = new Array(d.questions.length).fill(null); // each holds a bank token object or null
  let selectedToken = null;
  let submitted = false;
  let correctFlags = [];

  let secondsLeft = 6*60;
  let timerHandle = null;

  let html = "";
  html += '<div class="activity">';
  html += '<div class="activity-topbar"><div class="left">&#128214; '+activity.title+'</div><button class="close" id="closeBtn">&#10005;</button></div>';
  html += '<div class="activity-progressrow"><div class="track"><div class="fill" id="progFill" style="width:0%"></div></div><div class="timer">&#9200; <span id="timerLabel">6 minutes left</span></div></div>';
  html += '<div class="activity-body">';
  html += '<h2>Vocabulary</h2>';
  html += '<div class="instructions">'+d.instructions+esLine(d.instructionsEs)+'</div>';
  html += '<div class="vocab-bank" id="vocabBank"></div>';
  html += '<div class="vocab-grid" id="vocabGrid"></div>';
  html += '<div class="activity-feedback" id="feedback"></div>';
  html += '</div>';
  html += '<div class="activity-footer"><button class="submit-btn" id="submitBtn">Submit</button></div>';
  html += '</div>';
  app.innerHTML = html;

  const bankEl = document.getElementById("vocabBank");
  const gridEl = document.getElementById("vocabGrid");

  function drawBank(){
    let html2 = "";
    bank.forEach(tok => {
      const isUsed = placed.some(p => p && p.id === tok.id);
      const isSelected = selectedToken && selectedToken.id === tok.id;
      html2 += '<span class="vocab-word '+(isUsed?"used":"")+' '+(isSelected?"selected":"")+'" data-id="'+tok.id+'" draggable="'+(!isUsed && !submitted)+'">'+tok.word+'</span>';
    });
    bankEl.innerHTML = html2;

    if(!submitted){
      bankEl.querySelectorAll(".vocab-word").forEach(el => {
        const id = parseInt(el.getAttribute("data-id"),10);
        const tok = bank.find(t=>t.id===id);
        const isUsed = placed.some(p => p && p.id === tok.id);
        if(isUsed) return;
        el.onclick = () => {
          selectedToken = (selectedToken && selectedToken.id===tok.id) ? null : tok;
          drawBank();
        };
        el.ondragstart = (ev) => {
          ev.dataTransfer.setData("text/plain", String(tok.id));
        };
      });
    }
  }

  function drawGrid(){
    let html2 = "";
    html2 += '<div class="vocab-card"><img src="'+d.example.img+'" alt=""><div class="caption">'+d.example.before+' <span class="vocab-blank example">'+d.example.answer+'</span> '+d.example.after+esLine(d.example.capEs)+'</div></div>';

    d.questions.forEach((q,i) => {
      const tok = placed[i];
      let blankClass = "vocab-blank";
      if(tok) blankClass += " filled";
      if(submitted) blankClass += correctFlags[i] ? " correct" : " wrong";
      const label = tok ? tok.word : "&nbsp;&nbsp;&nbsp;&nbsp;";
      html2 += '<div class="vocab-card"><img src="'+q.img+'" alt="">';
      html2 += '<div class="caption">';
      if(q.before) html2 += q.before+' ';
      html2 += '<span class="'+blankClass+'" data-i="'+i+'">'+label+'</span>';
      if(q.after) html2 += ' '+q.after;
      html2 += esLine(q.capEs);
      html2 += '</div></div>';
    });
    gridEl.innerHTML = html2;

    if(!submitted){
      gridEl.querySelectorAll(".vocab-blank[data-i]").forEach(el => {
        const i = parseInt(el.getAttribute("data-i"),10);
        el.onclick = () => {
          if(placed[i]){
            placed[i] = null;
            drawBank(); drawGrid(); updateProgress();
            return;
          }
          if(selectedToken){
            placed[i] = selectedToken;
            selectedToken = null;
            drawBank(); drawGrid(); updateProgress();
          }
        };
        el.ondragover = (ev) => ev.preventDefault();
        el.ondrop = (ev) => {
          ev.preventDefault();
          const id = parseInt(ev.dataTransfer.getData("text/plain"),10);
          const tok = bank.find(t=>t.id===id);
          if(!tok) return;
          // remove token from any other blank first
          for(let k=0;k<placed.length;k++){
            if(placed[k] && placed[k].id===tok.id) placed[k]=null;
          }
          placed[i] = tok;
          selectedToken = null;
          drawBank(); drawGrid(); updateProgress();
        };
      });
    }
  }

  function updateProgress(){
    const answered = placed.filter(p=>p).length;
    document.getElementById("progFill").style.width = (answered/d.questions.length*100)+"%";
  }

  drawBank();
  drawGrid();

  document.getElementById("closeBtn").onclick = () => {
    if(timerHandle) clearInterval(timerHandle);
    screen = "menu";
    renderScreen();
  };

  document.getElementById("submitBtn").onclick = () => {
    if(submitted) return;
    const fb = document.getElementById("feedback");
    if(placed.some(p => !p)){
      fb.textContent = "Coloca todas las palabras antes de enviar.";
      return;
    }
    fb.textContent = "";
    submitted = true;
    let correctCount = 0;
    correctFlags = d.questions.map((q,i) => {
      const ok = placed[i].word === q.answer;
      if(ok) correctCount++;
      return ok;
    });

    applyScore(activity.id, correctCount, d.questions.length);

    drawBank();
    drawGrid();
    if(timerHandle) clearInterval(timerHandle);
    const submitBtn = document.getElementById("submitBtn");
    submitBtn.textContent = "Intentar de nuevo";
    submitBtn.onclick = () => renderScreen();
    showResultModal(correctCount, d.questions.length, () => renderScreen());
  };

  function tick(){
    if(submitted) return;
    secondsLeft = Math.max(0, secondsLeft-1);
    const minsLeft = Math.max(1, Math.ceil(secondsLeft/60));
    document.getElementById("timerLabel").textContent = (secondsLeft<=0 ? "0" : minsLeft) + " minutes left";
    if(secondsLeft<=0 && timerHandle){ clearInterval(timerHandle); }
  }
  timerHandle = setInterval(tick, 1000);
}

/* ================= READING ACTIVITY ================= */

function renderReading(activity){
  const d = activity.data;
  // answers[pageIndex][questionIndex] = selected option index or null
  const answers = d.pages.map(p => new Array(p.questions.length).fill(null));
  const totalQuestions = d.pages.reduce((sum,p) => sum + p.questions.length, 0);
  let current = 0;
  let submitted = false;
  let correctFlags = d.pages.map(p => new Array(p.questions.length).fill(false));

  let secondsLeft = 6*60;
  let timerHandle = null;

  let html = "";
  html += '<div class="activity">';
  html += '<div class="activity-topbar"><div class="left">&#128214; '+activity.title+'</div><button class="close" id="closeBtn">&#10005;</button></div>';
  html += '<div class="activity-progressrow"><div class="track"><div class="fill" id="progFill" style="width:0%"></div></div><div class="timer">&#9200; <span id="timerLabel">6 minutes left</span></div></div>';
  html += '<div class="activity-body">';
  html += '<h2>'+(d.heading || "Reading")+'</h2>';
  html += '<div class="instructions">'+d.instructions+esLine(d.instructionsEs)+'</div>';
  html += '<div id="readingBody"></div>';
  html += '<div class="activity-feedback" id="feedback"></div>';
  html += '</div>';
  html += '<div class="reading-pagerow" id="pagerow"></div>';
  html += '<div class="activity-footer"><button class="submit-btn" id="submitBtn">Submit</button></div>';
  html += '</div>';
  app.innerHTML = html;

  const bodyEl = document.getElementById("readingBody");
  const pagerEl = document.getElementById("pagerow");

  function passageHtml(page){
    if(page.passageType === "letter"){
      return '<div class="reading-passage letter">'+page.nameTop+'<br><br>'+page.passage+esLine(page.passageEs)+'<div class="signoff">'+page.nameBottom+'</div></div>';
    }
    if(page.passageType === "message"){
      return '<div class="reading-passage message"><div class="msg-header">'+page.nameTop+'</div><div class="msg-body">'+page.passage+esLine(page.passageEs)+'<div class="signoff">'+page.nameBottom+'</div></div></div>';
    }
    if(page.passageType === "photo"){
      return '<img class="reading-photo" src="'+page.img+'" alt="">';
    }
    if(page.passageType === "audio"){
      return "";
    }
    return '<div class="reading-passage">'+page.passage+esLine(page.passageEs)+'</div>';
  }

  function drawPage(){
    const page = d.pages[current];
    let html2 = "";
    html2 += passageHtml(page);

    page.questions.forEach((q, qi) => {
      if(q.question){
        html2 += '<div class="reading-question">'+q.question+esLine(q.questionEs)+'</div>';
      }
      if(page.passageType === "audio"){
        html2 += '<button class="listen-btn" type="button">&#9658;</button>';
      }
      if(q.optionType === "image"){
        html2 += '<div class="reading-options-img">';
        q.options.forEach((opt,i) => {
          let cls = "reading-opt-img";
          if(answers[current][qi]===i) cls += " selected";
          if(submitted){
            if(i===q.correct) cls += " correct";
            else if(answers[current][qi]===i) cls += " wrong";
          }
          html2 += '<div class="'+cls+'" data-qi="'+qi+'" data-i="'+i+'"><img src="'+opt.img+'" alt=""></div>';
        });
        html2 += '</div>';
      } else {
        html2 += '<div class="reading-options-text">';
        q.options.forEach((opt,i) => {
          let cls = "reading-opt-text";
          if(submitted){
            if(i===q.correct) cls += " correct";
            else if(answers[current][qi]===i) cls += " wrong";
          }
          html2 += '<label class="'+cls+'" data-qi="'+qi+'" data-i="'+i+'"><input type="radio" name="ropt'+qi+'" '+(answers[current][qi]===i?"checked":"")+' '+(submitted?"disabled":"")+'> '+opt.label+'</label>';
        });
        html2 += '</div>';
      }
    });

    if(page.passageType === "photo" || page.passageType === "audio"){
      html2 = '<div class="reading-centered">'+html2+'</div>';
    }
    bodyEl.innerHTML = html2;

    bodyEl.querySelectorAll(".listen-btn").forEach(btn => {
      btn.onclick = () => {
        showLockToast("Audio pendiente: esperando la respuesta correcta de José");
      };
    });

    if(!submitted){
      bodyEl.querySelectorAll("[data-qi]").forEach(el => {
        el.onclick = () => {
          const qi = parseInt(el.getAttribute("data-qi"),10);
          const i = parseInt(el.getAttribute("data-i"),10);
          answers[current][qi] = i;
          drawPage();
          drawPager();
          updateProgress();
        };
      });
    }
  }

  function drawPager(){
    let html2 = "";
    html2 += '<button class="navarrow" id="prevQ" '+(current===0?"disabled":"")+'>&#9664;</button>';
    d.pages.forEach((page,i) => {
      let cls = "reading-pagenum";
      const pageAnswered = answers[i].every(a => a!==null);
      if(i===current) cls += " current";
      else if(pageAnswered) cls += " answered";
      html2 += '<span class="'+cls+'" data-i="'+i+'">'+(i+1)+'</span>';
    });
    html2 += '<button class="navarrow" id="nextQ" '+(current===d.pages.length-1?"disabled":"")+'>&#9654;</button>';
    pagerEl.innerHTML = html2;

    document.getElementById("prevQ").onclick = () => { if(current>0){ current--; drawPage(); drawPager(); } };
    document.getElementById("nextQ").onclick = () => { if(current<d.pages.length-1){ current++; drawPage(); drawPager(); } };
    pagerEl.querySelectorAll(".reading-pagenum").forEach(el => {
      el.onclick = () => { current = parseInt(el.getAttribute("data-i"),10); drawPage(); drawPager(); };
    });
  }

  function updateProgress(){
    let answered = 0;
    answers.forEach(pageAns => pageAns.forEach(a => { if(a!==null) answered++; }));
    document.getElementById("progFill").style.width = (answered/totalQuestions*100)+"%";
  }

  drawPage();
  drawPager();
  updateProgress();

  document.getElementById("closeBtn").onclick = () => {
    if(timerHandle) clearInterval(timerHandle);
    screen = "menu";
    renderScreen();
  };

  document.getElementById("submitBtn").onclick = () => {
    if(submitted) return;
    const fb = document.getElementById("feedback");
    const allAnswered = answers.every(pageAns => pageAns.every(a => a!==null));
    if(!allAnswered){
      fb.textContent = "Responde todas las preguntas antes de enviar.";
      return;
    }
    fb.textContent = "";
    submitted = true;
    let correctCount = 0;
    correctFlags = d.pages.map((page,pi) => page.questions.map((q,qi) => {
      const ok = answers[pi][qi] === q.correct;
      if(ok) correctCount++;
      return ok;
    }));

    applyScore(activity.id, correctCount, totalQuestions);

    drawPage();
    drawPager();
    if(timerHandle) clearInterval(timerHandle);
    const submitBtn = document.getElementById("submitBtn");
    submitBtn.textContent = "Intentar de nuevo";
    submitBtn.onclick = () => renderScreen();
    showResultModal(correctCount, totalQuestions, () => renderScreen());
  };

  function tick(){
    if(submitted) return;
    secondsLeft = Math.max(0, secondsLeft-1);
    const minsLeft = Math.max(1, Math.ceil(secondsLeft/60));
    document.getElementById("timerLabel").textContent = (secondsLeft<=0 ? "0" : minsLeft) + " minutes left";
    if(secondsLeft<=0 && timerHandle){ clearInterval(timerHandle); }
  }
  timerHandle = setInterval(tick, 1000);
}

function renderGrammarBank(activity){
  const d = activity.data;
  const bank = shuffleArr(d.bankWords.map((w,i)=>({word:w, id:i})));
  const placed = new Array(d.questions.length).fill(null);
  let selectedToken = null;
  let submitted = false;
  let correctFlags = [];

  let secondsLeft = 6*60;
  let timerHandle = null;

  let html = "";
  html += '<div class="activity">';
  html += '<div class="activity-topbar"><div class="left">&#128214; '+activity.title+'</div><button class="close" id="closeBtn">&#10005;</button></div>';
  html += '<div class="activity-progressrow"><div class="track"><div class="fill" id="progFill" style="width:0%"></div></div><div class="timer">&#9200; <span id="timerLabel">6 minutes left</span></div></div>';
  html += '<div class="activity-body">';
  html += '<h2>Grammar</h2>';
  html += '<div class="instructions">'+d.instructions+esLine(d.instructionsEs)+'</div>';
  html += '<div class="vocab-bank" id="vocabBank"></div>';
  html += '<div id="gbRows"></div>';
  html += '<div class="activity-feedback" id="feedback"></div>';
  html += '</div>';
  html += '<div class="activity-footer"><button class="submit-btn" id="submitBtn">Submit</button></div>';
  html += '</div>';
  app.innerHTML = html;

  const bankEl = document.getElementById("vocabBank");
  const rowsEl = document.getElementById("gbRows");

  function drawBank(){
    let html2 = "";
    bank.forEach(tok => {
      const isUsed = placed.some(p => p && p.id === tok.id);
      const isSelected = selectedToken && selectedToken.id === tok.id;
      html2 += '<span class="vocab-word '+(isUsed?"used":"")+' '+(isSelected?"selected":"")+'" data-id="'+tok.id+'" draggable="'+(!isUsed && !submitted)+'">'+tok.word+'</span>';
    });
    bankEl.innerHTML = html2;

    if(!submitted){
      bankEl.querySelectorAll(".vocab-word").forEach(el => {
        const id = parseInt(el.getAttribute("data-id"),10);
        const tok = bank.find(t=>t.id===id);
        const isUsed = placed.some(p => p && p.id === tok.id);
        if(isUsed) return;
        el.onclick = () => {
          selectedToken = (selectedToken && selectedToken.id===tok.id) ? null : tok;
          drawBank();
        };
        el.ondragstart = (ev) => {
          ev.dataTransfer.setData("text/plain", String(tok.id));
        };
      });
    }
  }

  function drawRows(){
    let html2 = "";
    html2 += '<div class="qrow example"><span class="num">0</span><span>'+d.example.before+'</span><span class="vocab-blank example">'+d.example.answer+'</span>'+esLine(d.example.sentenceEs)+'</div>';

    d.questions.forEach((q,i) => {
      const tok = placed[i];
      let blankClass = "vocab-blank";
      if(tok) blankClass += " filled";
      if(submitted) blankClass += correctFlags[i] ? " correct" : " wrong";
      const label = tok ? tok.word : "&nbsp;&nbsp;&nbsp;&nbsp;";
      html2 += '<div class="qrow" data-i="'+i+'"><span class="num">'+(i+1)+'</span><span>'+q.before+'</span><span class="'+blankClass+'" data-i="'+i+'">'+label+'</span>'+esLine(q.sentenceEs)+'</div>';
    });
    rowsEl.innerHTML = html2;

    if(!submitted){
      rowsEl.querySelectorAll(".vocab-blank[data-i]").forEach(el => {
        const i = parseInt(el.getAttribute("data-i"),10);
        el.onclick = () => {
          if(placed[i]){
            placed[i] = null;
            drawBank(); drawRows(); updateProgress();
            return;
          }
          if(selectedToken){
            placed[i] = selectedToken;
            selectedToken = null;
            drawBank(); drawRows(); updateProgress();
          }
        };
        el.ondragover = (ev) => ev.preventDefault();
        el.ondrop = (ev) => {
          ev.preventDefault();
          const id = parseInt(ev.dataTransfer.getData("text/plain"),10);
          const tok = bank.find(t=>t.id===id);
          if(!tok) return;
          for(let k=0;k<placed.length;k++){
            if(placed[k] && placed[k].id===tok.id) placed[k]=null;
          }
          placed[i] = tok;
          selectedToken = null;
          drawBank(); drawRows(); updateProgress();
        };
      });
    }
  }

  function updateProgress(){
    const answered = placed.filter(p=>p).length;
    document.getElementById("progFill").style.width = (answered/d.questions.length*100)+"%";
  }

  drawBank();
  drawRows();

  document.getElementById("closeBtn").onclick = () => {
    if(timerHandle) clearInterval(timerHandle);
    screen = "menu";
    renderScreen();
  };

  document.getElementById("submitBtn").onclick = () => {
    if(submitted) return;
    const fb = document.getElementById("feedback");
    if(placed.some(p => !p)){
      fb.textContent = "Coloca todas las palabras antes de enviar.";
      return;
    }
    fb.textContent = "";
    submitted = true;
    let correctCount = 0;
    correctFlags = d.questions.map((q,i) => {
      const ok = placed[i].word === q.answer;
      if(ok) correctCount++;
      return ok;
    });

    applyScore(activity.id, correctCount, d.questions.length);

    drawBank();
    drawRows();
    if(timerHandle) clearInterval(timerHandle);
    const submitBtn = document.getElementById("submitBtn");
    submitBtn.textContent = "Intentar de nuevo";
    submitBtn.onclick = () => renderScreen();
    showResultModal(correctCount, d.questions.length, () => renderScreen());
  };

  function tick(){
    if(submitted) return;
    secondsLeft = Math.max(0, secondsLeft-1);
    const minsLeft = Math.max(1, Math.ceil(secondsLeft/60));
    document.getElementById("timerLabel").textContent = (secondsLeft<=0 ? "0" : minsLeft) + " minutes left";
    if(secondsLeft<=0 && timerHandle){ clearInterval(timerHandle); }
  }
  timerHandle = setInterval(tick, 1000);
}

/* ================= LISTENING (MATCH) ACTIVITY ================= */

function renderListeningMatch(activity){
  const d = activity.data;
  const connections = new Array(d.audios.length).fill(null); // imageIndex per audio slot, or null
  let selectedAudio = null;
  let submitted = false;
  let correctFlags = [];
  const hasExample = !!d.example;

  let secondsLeft = 6*60;
  let timerHandle = null;

  let html = "";
  html += '<div class="activity">';
  html += '<div class="activity-topbar"><div class="left">&#128214; '+activity.title+'</div><button class="close" id="closeBtn">&#10005;</button></div>';
  html += '<div class="activity-progressrow"><div class="track"><div class="fill" id="progFill" style="width:0%"></div></div><div class="timer">&#9200; <span id="timerLabel">6 minutes left</span></div></div>';
  html += '<div class="activity-body">';
  html += '<h2>Listening</h2>';
  html += '<div class="instructions">'+d.instructions+esLine(d.instructionsEs)+'</div>';
  html += '<div class="lm-scroll"><div class="lm-wrap" id="lmWrap">';
  html += '<div class="lm-audio-row" id="lmAudioRow"></div>';
  html += '<svg class="lm-svg" id="lmSvg"></svg>';
  html += '<div class="lm-image-row" id="lmImageRow"></div>';
  html += '</div></div>';
  html += '<div class="activity-feedback" id="feedback"></div>';
  html += '</div>';
  html += '<div class="activity-footer"><button class="submit-btn" id="submitBtn">Submit</button></div>';
  html += '</div>';
  app.innerHTML = html;

  const wrapEl = document.getElementById("lmWrap");
  const audioRowEl = document.getElementById("lmAudioRow");
  const imageRowEl = document.getElementById("lmImageRow");
  const svgEl = document.getElementById("lmSvg");

  function drawRows(){
    let ah = "";
    if(hasExample){
      ah += '<div class="lm-audio-cell" data-ai="ex">';
      ah += '<button class="listen-btn small" type="button" data-audio-ai="ex" disabled>&#9658;</button>';
      ah += '<span class="lm-dot active" data-audio-dot="ex"></span>';
      ah += '</div>';
    }
    d.audios.forEach((a,ai) => {
      const isSelected = selectedAudio === ai;
      const isConnected = connections[ai] !== null;
      let btnCls = "listen-btn small" + (isSelected ? " selected" : "");
      ah += '<div class="lm-audio-cell" data-ai="'+ai+'">';
      ah += '<button class="'+btnCls+'" type="button" data-audio-ai="'+ai+'">&#9658;</button>';
      ah += '<span class="lm-dot'+(isConnected||isSelected?" active":"")+'" data-audio-dot="'+ai+'"></span>';
      ah += '</div>';
    });
    audioRowEl.innerHTML = ah;

    let ih = "";
    d.images.forEach((img,ii) => {
      const isExampleImg = hasExample && d.example.correct === ii;
      const used = connections.some(c => c===ii) || isExampleImg;
      let cellCls = "lm-image-cell" + (used ? " used" : "") + (isExampleImg ? " example" : "");
      if(submitted){
        const ai = connections.findIndex(c => c===ii);
        if(ai !== -1){
          const ok = d.audios[ai].correct === ii;
          cellCls += ok ? " correct" : " wrong";
        }
      }
      ih += '<div class="'+cellCls+'" data-ii="'+ii+'">';
      ih += '<span class="lm-dot'+(used?" active":"")+'" data-image-dot="'+ii+'"></span>';
      ih += '<img src="'+img.img+'" alt="" data-image-ii="'+ii+'">';
      ih += '</div>';
    });
    imageRowEl.innerHTML = ih;

    if(!submitted){
      audioRowEl.querySelectorAll("[data-audio-ai]:not([disabled])").forEach(btn => {
        btn.onclick = () => {
          showLockToast("Audio pendiente: esperando la respuesta correcta de José");
          const ai = parseInt(btn.getAttribute("data-audio-ai"),10);
          selectedAudio = (selectedAudio === ai) ? null : ai;
          drawRows();
        };
      });
      imageRowEl.querySelectorAll("[data-image-ii]").forEach(imgEl => {
        imgEl.onclick = () => {
          const ii = parseInt(imgEl.getAttribute("data-image-ii"),10);
          if(hasExample && d.example.correct === ii) return; // image already taken by the example
          if(selectedAudio !== null){
            for(let k=0;k<connections.length;k++){
              if(connections[k]===ii) connections[k]=null;
            }
            connections[selectedAudio] = ii;
            selectedAudio = null;
          } else {
            const ai = connections.findIndex(c => c===ii);
            if(ai !== -1) connections[ai] = null;
          }
          drawRows();
          updateProgress();
        };
      });
    }

    drawLines();
  }

  function drawLines(){
    const wrapRect = wrapEl.getBoundingClientRect();
    svgEl.setAttribute("width", wrapRect.width);
    svgEl.setAttribute("height", wrapRect.height);
    let svgHtml = "";
    if(hasExample){
      const dotA = audioRowEl.querySelector('[data-audio-dot="ex"]');
      const dotB = imageRowEl.querySelector('[data-image-dot="'+d.example.correct+'"]');
      if(dotA && dotB){
        const ra = dotA.getBoundingClientRect();
        const rb = dotB.getBoundingClientRect();
        const x1 = ra.left + ra.width/2 - wrapRect.left;
        const y1 = ra.top + ra.height/2 - wrapRect.top;
        const x2 = rb.left + rb.width/2 - wrapRect.left;
        const y2 = rb.top + rb.height/2 - wrapRect.top;
        svgHtml += '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="var(--muted)" stroke-width="2.5" opacity="0.6" />';
      }
    }
    connections.forEach((ii, ai) => {
      if(ii === null) return;
      const dotA = audioRowEl.querySelector('[data-audio-dot="'+ai+'"]');
      const dotB = imageRowEl.querySelector('[data-image-dot="'+ii+'"]');
      if(!dotA || !dotB) return;
      const ra = dotA.getBoundingClientRect();
      const rb = dotB.getBoundingClientRect();
      const x1 = ra.left + ra.width/2 - wrapRect.left;
      const y1 = ra.top + ra.height/2 - wrapRect.top;
      const x2 = rb.left + rb.width/2 - wrapRect.left;
      const y2 = rb.top + rb.height/2 - wrapRect.top;
      let stroke = "var(--accent)";
      if(submitted){
        const ok = d.audios[ai].correct === ii;
        stroke = ok ? "var(--good)" : "var(--bad)";
      }
      svgHtml += '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+stroke+'" stroke-width="2.5" />';
    });
    svgEl.innerHTML = svgHtml;
  }

  function updateProgress(){
    const answered = connections.filter(c=>c!==null).length;
    document.getElementById("progFill").style.width = (answered/d.audios.length*100)+"%";
  }

  function onResize(){ drawLines(); }
  window.addEventListener("resize", onResize);

  drawRows();

  document.getElementById("closeBtn").onclick = () => {
    window.removeEventListener("resize", onResize);
    if(timerHandle) clearInterval(timerHandle);
    screen = "menu";
    renderScreen();
  };

  document.getElementById("submitBtn").onclick = () => {
    if(submitted) return;
    const fb = document.getElementById("feedback");
    if(connections.some(c => c===null)){
      fb.textContent = "Conecta todos los audios con una imagen antes de enviar.";
      return;
    }
    fb.textContent = "";
    submitted = true;
    let correctCount = 0;
    correctFlags = d.audios.map((a,ai) => {
      const ok = connections[ai] === a.correct;
      if(ok) correctCount++;
      return ok;
    });

    applyScore(activity.id, correctCount, d.audios.length);

    drawRows();
    if(timerHandle) clearInterval(timerHandle);
    const submitBtn = document.getElementById("submitBtn");
    submitBtn.textContent = "Intentar de nuevo";
    submitBtn.onclick = () => {
      window.removeEventListener("resize", onResize);
      renderScreen();
    };
    showResultModal(correctCount, d.audios.length, () => {
      window.removeEventListener("resize", onResize);
      renderScreen();
    });
  };

  function tick(){
    if(submitted) return;
    secondsLeft = Math.max(0, secondsLeft-1);
    const minsLeft = Math.max(1, Math.ceil(secondsLeft/60));
    document.getElementById("timerLabel").textContent = (secondsLeft<=0 ? "0" : minsLeft) + " minutes left";
    if(secondsLeft<=0 && timerHandle){ clearInterval(timerHandle); }
  }
  timerHandle = setInterval(tick, 1000);
}

function showResultModal(correct, total, onRetry){
  const pct = Math.round(correct/total*100);
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.innerHTML =
    '<div class="modal">'+
      '<h3><span class="check-icon">&#10003;</span>Submitted</h3>'+
      '<p>Submission has been successful. Muy bien! Tu puntaje se sumo al examen.</p>'+
      '<div class="modal-stats">'+
        '<div><div class="label">You answered</div><div class="value">'+total+'/'+total+'</div></div>'+
        '<div><div class="label">Correct</div><div class="value">'+correct+'</div></div>'+
        '<div><div class="label">Score</div><div class="value">'+pct+'%</div></div>'+
      '</div>'+
      '<div style="display:flex; gap:10px;">'+
        '<button class="modal-close" id="modalRetryBtn" style="background:var(--muted)">Intentar de nuevo</button>'+
        '<button class="modal-close" id="modalCloseBtn">Cerrar</button>'+
      '</div>'+
    '</div>';
  document.body.appendChild(backdrop);
  document.getElementById("modalCloseBtn").onclick = () => {
    backdrop.remove();
  };
  document.getElementById("modalRetryBtn").onclick = () => {
    backdrop.remove();
    if(onRetry) onRetry();
  };
}

/* ================= ROUTER ================= */

function renderScreen(){
  if(screen === "menu"){
    renderMenu();
    return;
  }
  const activity = activities.find(a => a.id === screen);
  if(!activity){ screen="menu"; renderMenu(); return; }
  if(activity.kind === "grammar"){
    renderGrammar(activity);
  } else if(activity.kind === "vocabulary"){
    renderVocabulary(activity);
  } else if(activity.kind === "reading"){
    renderReading(activity);
  } else if(activity.kind === "grammarmc"){
    renderGrammarMC(activity);
  } else if(activity.kind === "vocabularytext"){
    renderVocabularyText(activity);
  } else if(activity.kind === "grammarbank"){
    renderGrammarBank(activity);
  } else if(activity.kind === "listeninggrid"){
    renderListeningGrid(activity);
  } else if(activity.kind === "listeningmatch"){
    renderListeningMatch(activity);
  }
}

renderScreen();
</script>
